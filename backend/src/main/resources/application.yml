spring:
  application:
    name: edufin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edufin}
    username: ${DB_USERNAME:edufin}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é gerenciado exclusivamente pelo Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        name: EDUFIN_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Só verifica o SMTP quando o envio de e-mails estiver habilitado.
    mail:
      enabled: ${MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /api/docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /api/docs/ui
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    br.finedu: INFO

app:
  # Origens extras autorizadas a chamar a API (separadas por vírgula). Em produção o SPA é
  # servido pelo próprio backend (mesma origem) e esta lista pode ficar vazia.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # URL pública usada em links de e-mail (recuperação de senha).
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  mail:
    # A recuperação de senha só funciona com um servidor SMTP real configurado.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Administrador}
  retention:
    activity-log-days: ${RETENTION_ACTIVITY_DAYS:365}
    read-notification-days: ${RETENTION_NOTIFICATION_DAYS:180}
  rate-limit:
    enabled: true
    registrations-per-hour-per-ip: ${RATE_LIMIT_REGISTRATIONS_PER_HOUR:30}
  scheduler:
    reminders-cron: ${REMINDERS_CRON:0 0 8 * * *}
    retention-cron: ${RETENTION_CRON:0 30 3 * * *}
